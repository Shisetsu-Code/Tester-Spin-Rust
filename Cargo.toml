[package]
name = "tester-spin-rust"
version = "0.1.0"
edition = "2024"
default-run = "tester-spin-rust"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.37"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
url = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
