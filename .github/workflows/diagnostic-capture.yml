name: Diagnostic protocol evidence

on:
  push:
    branches: ['ci/evidence-*']
    paths:
      - '.github/workflows/diagnostic-capture.yml'
      - 'scripts/ci_capture*'
      - 'scripts/ci_capture_hooks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [elk, rubyplay]
    env:
      PYTHONPATH: scripts/ci_capture_hooks:engine
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      DATA_ROOT: data/diagnostic-${{ matrix.provider }}
      OUTPUT_DIR: artifacts/diagnostic-${{ matrix.provider }}
      CI_PUBLIC_ASSETS: artifacts/diagnostic-${{ matrix.provider }}/public-assets
      PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies and run full Python suite
        run: |
          mkdir -p "$OUTPUT_DIR" evidence
          git rev-parse HEAD > "$OUTPUT_DIR/commit.txt"
          python -m pip install -r requirements-ci.txt
          python -m unittest discover -s tests -v 2>&1 | tee "$OUTPUT_DIR/python-tests.log"
          python -m playwright install --with-deps chromium
      - name: Collect the same bounded catalog sample
        id: catalog
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 240s python scripts/ci_catalog.py --provider "$PROVIDER" --data-root "$DATA_ROOT" --output "$OUTPUT_DIR/selected-games.json" --limit 3 --max-pages 100
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Capture isolated demo runs with original adapter
        id: execution
        if: steps.catalog.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 900s python -m tester_spin.cli run "$PROVIDER" --data-root "$DATA_ROOT" --statuses ALL --limit 3 --spins 2 --timeout 30 --wall-timeout 240 --public-summary "$OUTPUT_DIR/summary.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Export canonical game statuses
        if: always()
        env:
          CATALOG_EXIT: ${{ steps.catalog.outputs.exit_code || '125' }}
          RUN_EXIT: ${{ steps.execution.outputs.exit_code || '125' }}
        run: python scripts/ci_audit_report.py provider --provider "$PROVIDER" --data-root "$DATA_ROOT" --output "$OUTPUT_DIR" --limit 3 --spins 2 --catalog-exit "$CATALOG_EXIT" --run-exit "$RUN_EXIT"
      - name: Export bounded sanitized evidence
        if: always()
        run: python scripts/ci_capture_evidence.py --root "$DATA_ROOT" --output "$OUTPUT_DIR/protocol"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.provider }}
          path: artifacts/diagnostic-${{ matrix.provider }}
          retention-days: 7
